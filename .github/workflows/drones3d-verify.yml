name: Verify Drones 3D APK

on:
  push:
    branches:
      - arena/27ed54dd-adasa-ai-audit1
    paths:
      - .github/workflows/drones3d-verify.yml

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jr30rashid-coder/-
          ref: 228ad273c4974c2257d77de1fb20078182ce52ed
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0' 'build-tools;36.1.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Run and diagnose release unit tests
        shell: bash
        run: |
          set -euo pipefail
          export KEYSTORE_PATH="$RUNNER_TEMP/disposable-test-signing.p12"
          export STORE_PASSWORD='temporary-test-password'
          export KEY_PASSWORD="$STORE_PASSWORD"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KEYSTORE_PATH" \
            -alias upload -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=Disposable test key' \
            -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD >/dev/null 2>&1
          if ! gradle --no-daemon --stacktrace :app:testReleaseUnitTest 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"; then
            echo '::error::Release unit-test task failed; relevant output follows.'
            grep -Ei '^e:|error:|^\* What went wrong:|^> |^Execution failed|^Caused by:|^FAILURE|could not|not found' "$RUNNER_TEMP/unit-tests.log" | tail -n 35 | while IFS= read -r line; do
              echo "::error::$line"
            done || true
            exit 1
          fi
          echo '::notice::Release unit tests passed.'
  emulator-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out APK and smoke-test script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android 11 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/drones3d-smoke-test.sh
      - name: Publish smoke-test evidence to this branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smoke-test/
          git commit -m 'test: record Drones 3D emulator launch'
          git push origin "HEAD:$GITHUB_REF"
