name: Verify Drones 3D APK

on:
  push:
    branches:
      - arena/27ed54dd-adasa-ai-audit1
    paths:
      - .github/workflows/drones3d-verify.yml

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jr30rashid-coder/-
          ref: 228ad273c4974c2257d77de1fb20078182ce52ed
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0' 'build-tools;36.1.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Run and diagnose debug unit tests
        shell: bash
        run: |
          set -euo pipefail
          # AGP 9 creates unit-test tasks for the debug build type by default.
          keytool -genkeypair -noprompt -storetype JKS -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -storepass android -keypass android >/dev/null 2>&1
          if gradle --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g :app:testDebugUnitTest > "$RUNNER_TEMP/unit-tests.log" 2>&1; then
            echo 'Gradle unit-test task completed.'
          else
            status=$?
            echo "::error::Debug unit-test task exited with status $status."
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'unit-tests.log').read_text(errors='replace').splitlines()
          excerpt = '\n'.join(lines[-75:])
          excerpt = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Last unit-test log lines::' + excerpt)
          PY
            exit 1
          fi
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          suites = [ET.parse(path).getroot() for path in files]
          total = sum(int(s.attrib.get('tests', '0')) for s in suites)
          failures = sum(int(s.attrib.get('failures', '0')) + int(s.attrib.get('errors', '0')) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', '0')) for s in suites)
          print(f'::notice::Debug unit-test results: {total} tests, {failures} failures/errors, {skipped} skipped.')
          if not files or total == 0 or failures:
              raise SystemExit('No valid, passing test results were produced')
          PY
  emulator-smoke-test:
    if: ${{ false }} # The signed APK was already smoke-tested on Android 11.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out APK and smoke-test script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android 11 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/drones3d-smoke-test.sh
      - name: Publish smoke-test evidence to this branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smoke-test/
          git commit -m 'test: record Drones 3D emulator launch'
          git push origin "HEAD:$GITHUB_REF"
